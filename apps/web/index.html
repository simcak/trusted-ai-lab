<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bezpečná AI v praxi: galerie interaktivních ukázek, jak používat AI s ohledem na soukromí, lokálně a pod kontrolou pravidel. Běží v prohlížeči bez API klíče."
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Theme before first paint (no flash): the visitor's choice, else the system setting.
      // Kept in sync with src/theme/theme.ts.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#151a35' : '#ffffff');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Bezpečná AI v praxi</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Tato ukázka potřebuje JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
